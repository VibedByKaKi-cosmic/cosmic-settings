name: Build

# Builds the amd64 .deb on every branch push.
# Publishing (GitHub Release and APT repository) runs only for pushes to master.
# CI scripts live in .ci/ on master.

on:
  push:
    branches: ['**']

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  # Stops the `debconf: unable to initialize frontend` errors.
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    name: Build (amd64)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: .ci/install-build-deps.sh

      - name: Install Rust toolchain
        # Installs the version pinned in rust-toolchain.toml.
        run: rustup show

      - name: Set package version
        run: .ci/set-version.sh

      - name: Build Debian package
        run: .ci/build-deb.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cosmic-settings-amd64
          path: artifacts/*.deb
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set release metadata
        run: .ci/set-version.sh

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: cosmic-settings-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TITLE }}
          prerelease: true
          generate_release_notes: true
          files: artifacts/*.deb

  apt:
    name: Update APT repository
    needs: release
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: cosmic-settings-*
          merge-multiple: true

      - name: Install APT repository tools
        run: sudo apt-get update && sudo apt-get install -y reprepro gnupg

      - name: Set package version
        run: .ci/set-version.sh

      - name: Update apt branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APT_REPO_GPG_PRIVATE_KEY: ${{ secrets.APT_REPO_GPG_PRIVATE_KEY }}
        run: .ci/update-apt-repo.sh
